<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dumbshow harness — boxes</title>
    <style>
      /* The theming contract, v0: dumbshow's chrome (composer.css) reads
         these custom properties, and keys its dark styling off a `dark`
         class on <html>. The host defines both; these are the harness's
         definitions. (Renaming the token set to a dumbshow-owned prefix
         is planned as a follow-up with the daft docs host.) */
      :root {
        color-scheme: light dark;
        --vp-c-bg: #ffffff;
        --vp-c-bg-soft: #f6f6f7;
        --vp-c-divider: #e2e2e3;
        --vp-c-text-1: #3c3c43;
        --vp-c-text-2: #67676c;
        --vp-c-text-3: #929295;
        --vp-font-family-base: ui-sans-serif, system-ui, sans-serif;
        --vp-font-family-mono: ui-monospace, "SF Mono", Menlo, monospace;
        --daft-gold: #bd8c26;
        --daft-gold-text: #9a7115;
        --daft-rust: #c75c1e;
        --daft-rust-text: #b14e14;
      }
      html.dark {
        --vp-c-bg: #1b1b1f;
        --vp-c-bg-soft: #202127;
        --vp-c-divider: #2e2e32;
        --vp-c-text-1: #dfdfd6;
        --vp-c-text-2: #98989f;
        --vp-c-text-3: #6a6a71;
        --daft-gold: #d1a54a;
        --daft-gold-text: #e0b866;
        --daft-rust: #d9752f;
        --daft-rust-text: #e08a4a;
      }
      body {
        margin: 0;
        font-family: var(--vp-font-family-base);
        background: var(--vp-c-bg);
        color: var(--vp-c-text-1);
      }
    </style>
    <script>
      if (matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add("dark");
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
