name: Release

# The release train, driven by changesets (https://github.com/changesets):
#
#   push to master ──► select-mode ──┬─► version: open/refresh the
#                                    │   "chore: version packages" PR
#                                    │   (version bump + CHANGELOG.md)
#                                    └─► publish: build, `pnpm publish`
#                                        over npm trusted publishing
#                                        (OIDC), tag <pkg>@<ver>, GitHub Releases
#
# Merging the Version Packages PR is the release decision; this workflow
# does nothing a human has not merged. The three sub-actions are used
# instead of the combined changesets/action so that `id-token: write` —
# the OIDC publish permission — exists only in the publish job.
#
# Identity: the Wheatley GitHub App token opens the PR (so CI runs on it —
# PRs opened with GITHUB_TOKEN never trigger workflows), writes the release
# commit and the tag through the GitHub API (signed by GitHub, attributed
# to the App, which is the only non-admin actor the `release tags` ruleset
# lets create release tags), and creates one GitHub Release per package.
#
# npm: no token anywhere. The publish job exchanges its GitHub OIDC token
# for a short-lived npm credential through the Trusted Publisher registered
# on each published package — @dumbshow/core and @dumbshow/vue — (owner
# avihut, repo dumbshow, workflow release.yml: the filename is part of the
# trust relationship; do not rename this file without updating npm on
# both). Provenance is attested automatically.

on:
  push:
    branches: [master]

# One release train at a time; never cancel a publish mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  mode:
    name: Select mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: pnpm install --frozen-lockfile
      - id: select
        uses: changesets/action/select-mode@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
      - run: echo "mode=${{ steps.select.outputs.mode }}"

  version:
    name: Version Packages PR
    needs: mode
    if: needs.mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: read # the App token does every write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WHEATLEY_BOT_APP_ID }}
          private-key: ${{ secrets.WHEATLEY_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: pnpm changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          # @changesets/changelog-github links each entry to its PR/commit.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish to npm
    needs: mode
    if: needs.mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WHEATLEY_BOT_APP_ID }}
          private-key: ${{ secrets.WHEATLEY_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/publish@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: pnpm release
          create-github-releases: true
        env:
          # Belt and braces: trusted publishing attests provenance on its
          # own; this keeps it on even if the publish tool ever needs the
          # flag spelled out.
          NPM_CONFIG_PROVENANCE: "true"
