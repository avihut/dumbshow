name: CI

# Every check a PR must pass before it can land on master. The jobs run the
# same `mise run` tasks a contributor runs locally, so a red job here names
# the task that would have failed on their machine, and the tool versions
# come from mise.toml — never duplicated in this file.
#
# Required status checks (the master ruleset) are keyed on the job names
# below: lint, typecheck, build, test, dco, changeset. Rename one here and
# the ruleset must be updated in the same change.

on:
  pull_request:
    # labeled/unlabeled re-run the changeset gate when `skip-changeset` is
    # toggled; the rest is the default set.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: pnpm install --frozen-lockfile
      - run: mise run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: pnpm install --frozen-lockfile
      - run: mise run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: pnpm install --frozen-lockfile
      - run: mise run build
      # The tarball is the product. Assert its shape so `files`/`exports`
      # drift (or a source leak) fails here, not after a publish.
      - name: Check the package tarball
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          tarball=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'avihut-dumbshow-*.tgz' | head -n 1)
          test -n "$tarball" || { echo "::error::pnpm pack produced no tarball"; exit 1; }
          tar tzf "$tarball" | sort > "$RUNNER_TEMP/files.txt"
          echo "Tarball contents:"; cat "$RUNNER_TEMP/files.txt"
          fail=0
          for required in \
            package/package.json \
            package/README.md \
            package/LICENSE.md \
            package/dist/dumbshow.js \
            package/dist/dumbshow.css \
            package/dist/index.d.ts \
            package/dist/language.d.ts \
            package/dist/engine.d.ts; do
            grep -qx "$required" "$RUNNER_TEMP/files.txt" || { echo "::error::missing from tarball: $required"; fail=1; }
          done
          if grep -qE '^package/(src|harness|tests|node_modules)/' "$RUNNER_TEMP/files.txt"; then
            echo "::error::source or test files leaked into the tarball"; fail=1
          fi
          exit "$fail"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: pnpm install --frozen-lockfile
      - run: mise run test

  # Developer Certificate of Origin: every human commit in a PR carries a
  # Signed-off-by trailer (CONTRIBUTING.md). Bot commits — Dependabot, the
  # Version Packages PR written by the release bot — are exempt; a sign-off
  # from a machine certifies nothing.
  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$sha")
            case "$email" in
              *"[bot]@users.noreply.github.com") echo "skip  $sha  ($email)"; continue ;;
            esac
            if git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "ok    $sha  ($email)"
            else
              echo "::error::commit $sha by $email has no Signed-off-by trailer — commit with 'git commit -s' (see CONTRIBUTING.md)"
              fail=1
            fi
          done
          exit "$fail"

  # Every change that ships in the package needs a changeset declaring its
  # bump (`pnpm changeset`). Skipped for the release bot's own Version
  # Packages PR (it consumes changesets), for Dependabot, and when a human
  # applies the `skip-changeset` label to a change with nothing user-facing.
  changeset:
    name: changeset
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changeset')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a changeset for package-affecting changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "Changed files:"; echo "$changed"
          if ! grep -qE '^(src/|package\.json$|pnpm-lock\.yaml$|vite\.config\.ts$|tsconfig(\.build)?\.json$)' <<<"$changed"; then
            echo "No package-affecting changes — no changeset required."
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$BASE...$HEAD" -- '.changeset/*.md' | grep -v '/README\.md$' || true)
          if [ -z "$added" ]; then
            echo "::error::This PR changes the package but adds no changeset. Run 'pnpm changeset' and commit the file it writes — or apply the 'skip-changeset' label if nothing user-facing changed."
            exit 1
          fi
          echo "Changesets added:"; echo "$added"
