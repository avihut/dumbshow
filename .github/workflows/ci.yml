name: CI

# Every check a PR must pass before it can land on master. The jobs run the
# same `mise run` tasks a contributor runs locally, so a red job here names
# the task that would have failed on their machine, and the tool versions
# come from mise.toml — never duplicated in this file.
#
# Required status checks (the master ruleset) are keyed on the job names
# below: lint, typecheck, build, test, dco, changeset. Rename one here and
# the ruleset must be updated in the same change.

on:
  pull_request:
    # labeled/unlabeled re-run the changeset gate when `skip-changeset` is
    # toggled; the rest is the default set.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: pnpm install --frozen-lockfile
      - run: mise run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: pnpm install --frozen-lockfile
      - run: mise run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: pnpm install --frozen-lockfile
      - run: mise run build
      # The tarballs are the product. Assert each published package's shape
      # so `files`/`exports` drift, a source leak, a `workspace:` protocol
      # that survived packing, or a framework import in the framework-free
      # core fails here, not after a publish.
      - name: Check the package tarballs
        run: |
          set -euo pipefail
          fail=0
          check() { # <package name> <required path>...
            local name="$1"; shift
            local dest; dest=$(mktemp -d)
            pnpm --filter "$name" pack --pack-destination "$dest" >/dev/null
            local tarball; tarball=$(find "$dest" -maxdepth 1 -name '*.tgz' | head -n 1)
            test -n "$tarball" || { echo "::error::pnpm pack produced no tarball for $name"; fail=1; return; }
            tar tzf "$tarball" | sort > "$dest/files.txt"
            echo "== $name"; cat "$dest/files.txt"
            for required in "$@"; do
              grep -qx "$required" "$dest/files.txt" || { echo "::error::$name: missing from tarball: $required"; fail=1; }
            done
            if grep -qE '^package/(src|tests|node_modules)/' "$dest/files.txt"; then
              echo "::error::$name: source or test files leaked into the tarball"; fail=1
            fi
            tar xzf "$tarball" -C "$dest" package/package.json
            if grep -q 'workspace:' "$dest/package/package.json"; then
              echo "::error::$name: a workspace: protocol survived packing"; fail=1
            fi
          }
          check @dumbshow/core \
            package/package.json package/README.md package/LICENSE.md \
            package/dist/index.js package/dist/style.css package/dist/index.d.ts \
            package/dist/language.d.ts package/dist/engine.d.ts
          check @dumbshow/vue \
            package/package.json package/README.md package/LICENSE.md \
            package/dist/index.js package/dist/index.d.ts package/dist/ComposerApp.vue.d.ts
          # The core is framework-free: its bundle must not import vue.
          if grep -qE 'from "vue"|require\("vue"\)' packages/core/dist/index.js; then
            echo "::error::@dumbshow/core imports vue"; fail=1
          fi
          exit "$fail"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: pnpm install --frozen-lockfile
      - run: mise run test

  # Developer Certificate of Origin: every human commit in a PR carries a
  # Signed-off-by trailer (CONTRIBUTING.md). Bot commits — Dependabot, the
  # Version Packages PR written by the release bot — are exempt; a sign-off
  # from a machine certifies nothing.
  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$sha")
            case "$email" in
              *"[bot]@users.noreply.github.com") echo "skip  $sha  ($email)"; continue ;;
            esac
            if git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "ok    $sha  ($email)"
            else
              echo "::error::commit $sha by $email has no Signed-off-by trailer — commit with 'git commit -s' (see CONTRIBUTING.md)"
              fail=1
            fi
          done
          exit "$fail"

  # Every change that ships in a published package needs a changeset
  # declaring its bump (`pnpm changeset`). Skipped for the release bot's own Version
  # Packages PR (it consumes changesets), for Dependabot, and when a human
  # applies the `skip-changeset` label to a change with nothing user-facing.
  changeset:
    name: changeset
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changeset')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a changeset for package-affecting changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "Changed files:"; echo "$changed"
          if ! grep -qE '^(packages/(core|vue)/|pnpm-lock\.yaml$)' <<<"$changed"; then
            echo "No package-affecting changes — no changeset required."
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$BASE...$HEAD" -- '.changeset/*.md' | grep -v '/README\.md$' || true)
          if [ -z "$added" ]; then
            echo "::error::This PR changes a published package but adds no changeset. Run 'pnpm changeset' and commit the file it writes — or apply the 'skip-changeset' label if nothing user-facing changed."
            exit 1
          fi
          echo "Changesets added:"; echo "$added"
