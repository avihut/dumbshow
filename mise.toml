[tools]
node = "24.18.0"
pnpm = "11.17.0"

# Keep node_modules current when entering the repo or when the lockfile
# changes — tasks below assume an installed tree.
[hooks]
enter = "pnpm install --frozen-lockfile --prefer-offline 2>/dev/null || pnpm install"

[tasks.dev]
description = "Run the harness dev app (the editor + the boxes pack)"
run = "pnpm dev"

[tasks.build]
description = "Build the library to dist/ (vite first, then vue-tsc declarations)"
run = "pnpm build"

[tasks.test]
description = "Run the vitest suite"
run = "pnpm test"

[tasks.lint]
description = "Biome check (lint + format, read-only)"
run = "pnpm lint"

[tasks.format]
description = "Biome check --write"
run = "pnpm format"

[tasks.typecheck]
description = "vue-tsc, no emit (src, harness, tests)"
run = "pnpm typecheck"

[tasks.changeset]
description = "Declare a change and its semver bump (writes .changeset/*.md)"
run = "pnpm changeset"

[tasks.ci]
description = "Everything CI runs on a PR: lint, typecheck, build, test"
depends = ["lint", "typecheck", "build", "test"]
