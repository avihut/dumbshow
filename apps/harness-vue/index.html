<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dumbshow harness — boxes</title>
    <style>
      /* The theming contract, v1. dumbshow's chrome resolves everything
         through `--dx-*` tokens and ships defaults for all of them behind
         `:where()` (zero specificity), so a host that declares nothing gets a
         coherent theme in both modes. This harness declares exactly two —
         the accent pair, in a blue the defaults would never produce — so the
         other half of the contract is exercised too: a host declaration at
         `:root` outranks the default no matter which sheet loads first.

         Falling through to @dumbshow/core/style.css: --dx-bg, --dx-bg-soft,
         --dx-divider, --dx-text-1, --dx-text-2, --dx-text-3, --dx-font,
         --dx-font-mono, --dx-warn, --dx-warn-text, --dx-teal, --dx-teal-text,
         --dx-purple, --dx-purple-text, --dx-sel.

         Note --dx-sel: it is derived from --dx-accent, so the selection tint
         follows the override below without this file saying anything. And an
         overridden token is the host's in BOTH themes — hence the dark rule.

         --dx-on-accent is the ink on an accent-filled surface, and taking the
         accent means taking it too: white reads on this blue (5.59:1) but not
         on the default gold (3.02:1), and not on the pale blue this file uses
         in dark mode (2.44:1) — which is why the two themes disagree here. */
      :root {
        color-scheme: light dark;
        --dx-accent: #2f66bd;
        --dx-accent-text: #2c62ad;
        --dx-on-accent: #ffffff;
      }
      html.dark {
        --dx-accent: #6fa8f5;
        --dx-accent-text: #8dbcff;
        --dx-on-accent: #0d1b2a;
      }
      body {
        margin: 0;
        font-family: var(--dx-font);
        background: var(--dx-bg);
        color: var(--dx-text-1);
      }
    </style>
    <script>
      if (matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add("dark");
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
